name: xuanshang
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: xuanshang-app:${APP_VERSION:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WASP_SERVER_URL: https://${DOMAIN}
      WASP_WEB_CLIENT_URL: https://${DOMAIN}
      SMTP_HOST: mail-relay
      SMTP_PORT: 2525
      SMTP_USERNAME: ${RELAY_USERNAME}
      SMTP_PASSWORD: ${RELAY_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
      mail-relay: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status>=200&&r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [internal]

  mail-relay:
    build: ./email-relay
    image: xuanshang-email-relay:${APP_VERSION:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(2525,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [internal]

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        WASP_SERVER_URL: https://${DOMAIN}
    image: xuanshang-web:${APP_VERSION:-local}
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    logging: *default-logging
    networks: [internal]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  internal:
